apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kevgate-admit.fullname" . }}-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kevgate-admit.labels" . | nindent 4 }}
data:
  policy.yaml: |
    {{- toYaml .Values.policy | nindent 4 }}
{{- if and (not .Values.evidence.existingConfigMap) (not .Values.evidence.existingClaim) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kevgate-admit.evidenceConfigMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kevgate-admit.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
# Filled by the scan pipeline with sha256-<hex>.json Trivy reports.
data: {}
{{- end }}
