{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kevgate-admit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kevgate-admit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kevgate-admit.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # The API server connects from addresses that cannot be selected portably.
    - ports:
        - port: 8443
          protocol: TCP
    {{- if .Values.networkPolicy.metricsFrom }}
    - from:
        {{- range .Values.networkPolicy.metricsFrom }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
