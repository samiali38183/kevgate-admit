apiVersion: apps/v1
kind: Deployment
metadata:
  name: clean
  labels:
    app: clean
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clean
  template:
    metadata:
      labels:
        app: clean
    spec:
      containers:
        - name: app
          image: registry.example.com/demo/clean@sha256:1111111111111111111111111111111111111111111111111111111111111111
          command: ["sleep", "3600"]
