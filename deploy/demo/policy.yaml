# Demo policy. The namespaces below are created by demo.sh.
version: 1
mode: enforce
default:
  requireDigest: true
  requireEvidence: deny
  denyKev: true
namespaces:
  demo-enforce:
    denyKev: true
    maxRisk: 40
    requireDigest: true
    requireEvidence: deny
    allowedRegistries:
      - registry.example.com/demo
  demo-audit:
    mode: audit
    denyKev: true
    maxRisk: 40
    requireDigest: true
    requireEvidence: deny
    allowedRegistries:
      - registry.example.com/demo
